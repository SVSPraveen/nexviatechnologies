[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-prototype"
version = "1.0.0"
description = "Two-Stage Personalized Recommendation Engine Prototype (Retrieval + DCN Ranking)"
authors = [{ name = "Recommender Team" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "fakeredis>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:hypothesis -p no:pytest_asyncio"

