apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyst-dashboard
  namespace: fraud-detection-prototype
  labels:
    app: analyst-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyst-dashboard
  template:
    metadata:
      labels:
        app: analyst-dashboard
    spec:
      containers:
        - name: analyst-dashboard
          image: aegis-analyst-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          env:
            - name: STREAMLIT_SERVER_PORT
              value: "8501"
            - name: STREAMLIT_SERVER_HEADLESS
              value: "true"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: analyst-dashboard
  namespace: fraud-detection-prototype
spec:
  type: NodePort
  selector:
    app: analyst-dashboard
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30501

